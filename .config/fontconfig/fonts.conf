<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- monospace: 霞鹜文楷等宽 屏幕阅读版 + Inconsolata 回退 -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>LXGW WenKai Mono Screen</family>
      <family>Inconsolata</family>
      <family>JetBrainsMono Nerd Font Mono</family>
    </prefer>
  </alias>

  <!-- sans-serif: 霞鹜文楷 屏幕阅读版 + Roboto 回退 -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>LXGW WenKai Screen</family>
      <family>Roboto</family>
    </prefer>
  </alias>

  <!-- serif 保持系统默认，仅补中文回退 -->
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>LXGW WenKai Screen</family>
    </prefer>
  </alias>
</fontconfig>
