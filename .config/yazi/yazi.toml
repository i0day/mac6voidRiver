# yazi 主配置 — Void + dwm + st(X11)
# 图片/视频/PDF 预览走 ueberzugpp（X11 window overlay，高分辨率）
# 依赖: ueberzugpp(自编译 /usr/local/bin), ffmpegthumbnailer(视频缩略), pdftoppm(poppler, PDF), chafa(兜底)

[manager]
ratio = [1, 3, 4]        # 预览区尽量大
show_hidden = false

[preview]
wrap = "no"
max_width = 1600
max_height = 1600
image_quality = 90
image_filter = "lanczos3"
# ueberzugpp 定位微调（若图片偏移再改这四个值: x, y, w, h 像素偏移）
ueberzug_scale = 1.0
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = 'st -e nvim "$@"', block = false, for = "unix" },
]
open = [
  { run = 'xdg-open "$@"', desc = "打开", for = "unix" },
]
play = [
  { run = 'mpv --force-window "$@"', orphan = true, for = "unix" },
]
